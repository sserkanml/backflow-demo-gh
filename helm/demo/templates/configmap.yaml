apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-helm-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "demo.labels" . | nindent 4 }}
data:
  # One key per mapping case.
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  REGION: {{ .Values.global.region | quote }}
  LOG_LEVEL_UP: {{ .Values.config.logLevel | upper | quote }}
  TIMEOUT: {{ .Values.config.timeout | quote }}
  FEATURE: {{ .Values.config.feature | quote }}
  # EQUAL_A and EQUAL_B come from two values that are equal in values-dev.yaml:
  # two candidates for the old value of either key. Changing colorB would change
  # EQUAL_B instead, so verification picks colorA for EQUAL_A (and colorB for EQUAL_B).
  EQUAL_A: {{ .Values.config.colorA | quote }}
  EQUAL_B: {{ .Values.config.colorB | quote }}
  # A true ambiguity: minA and minB are both 3, so changing either of them to
  # the same new value gives the same output. Two candidates verify.
  AMBIGUOUS: {{ max .Values.config.minA .Values.config.minB | quote }}
